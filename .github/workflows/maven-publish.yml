name: Publish to custom Maven

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.8.0)'
        required: true
      release:
        description: 'Publish as release'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
  COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
  COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}

jobs:
  resolve-version:
    name: 'Resolve Version'
    runs-on: ubuntu-24.04
    outputs:
      deploy_version: ${{ steps.version.outputs.deploy_version }}
      deploy_release: ${{ steps.version.outputs.deploy_release }}
    steps:
      - name: 'Set version'
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "deploy_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "deploy_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "deploy_release=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          fi

  docker-publish:
    name: 'Build Docker Images'
    needs: resolve-version
    uses: ./.github/workflows/docker-publish.yml
    with:
      publish: true
      build_windows: false
    permissions:
      contents: read
      packages: write

  Linux:
    name: 'Linux x64'
    runs-on: ubuntu-24.04
    needs: [resolve-version, docker-publish]
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish AWT x64'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
              -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
              -Pskiko.awt.enabled=true \
              -Pskiko.arch=x64 \
              :skiko:publishToComposeRepo \
              :skiko-graphite:publishToComposeRepo

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Native'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        with:
          image_name: linux-amd64
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
              -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
              -Pskiko.native.linux.enabled=true \
              -Pskiko.awt.enabled=false \
              :skiko:publishLinuxArm64PublicationToComposeRepoRepository \
              :skiko:publishLinuxX64PublicationToComposeRepoRepository

  LinuxArm:
    name: 'Linux arm64'
    runs-on: ubuntu-24.04-arm
    needs: [resolve-version, docker-publish]
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish AWT Runtime arm64'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
              -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
              -Pskiko.awt.enabled=true \
              -Pskiko.arch=arm64 \
              :skiko:publishSkikoJvmRuntimeLinuxArm64PublicationToComposeRepoRepository \
              :skiko-graphite:publishSkikoJvmRuntimeLinuxArm64PublicationToComposeRepoRepository

  macOS:
    name: 'macOS'
    runs-on: macos-15
    needs: [resolve-version, docker-publish]
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish arm64'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
            -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
            -Pskiko.native.mac.enabled=true \
            -Pskiko.awt.enabled=true \
            -Pskiko.arch=arm64 \
            :skiko:publishToComposeRepo \
            :skiko-graphite:publishToComposeRepo

      - shell: bash
        name: 'Publish AWT Runtime x64'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
            -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
            -Pskiko.awt.enabled=true \
            -Pskiko.arch=x64 \
            :skiko:publishSkikoJvmRuntimeMacosX64PublicationToComposeRepoRepository \
            :skiko-graphite:publishSkikoJvmRuntimeMacosX64PublicationToComposeRepoRepository

  Windows:
    name: 'Windows'
    runs-on: windows-2022
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: microsoft/setup-msbuild@v1

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish x64'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
            -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
            -Pskiko.awt.enabled=true \
            -Pskiko.arch=x64 \
            :skiko:publishToComposeRepo \
            :skiko-graphite:publishToComposeRepo

      - shell: bash
        name: 'Publish AWT Runtime arm64'
        env:
          COMPOSE_REPO_URL: ${{ secrets.COMPOSE_REPO_URL }}
          COMPOSE_REPO_USERNAME: ${{ secrets.COMPOSE_REPO_USERNAME }}
          COMPOSE_REPO_KEY: ${{ secrets.COMPOSE_REPO_KEY }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pdeploy.version=${{ needs.resolve-version.outputs.deploy_version }} \
            -Pdeploy.release=${{ needs.resolve-version.outputs.deploy_release }} \
            -Pskiko.awt.enabled=true \
            -Pskiko.arch=arm64 \
            :skiko:publishSkikoJvmRuntimeWindowsArm64PublicationToComposeRepoRepository \
            :skiko-graphite:publishSkikoJvmRuntimeWindowsArm64PublicationToComposeRepoRepository
